<!DOCTYPE html>
<html lang="en">

<head>
  <script src="https://code.jquery.com/jquery-3.6.3.js" integrity="sha256-nQLuAZGRRcILA+6dMBOvcRh5Pe310sBpanc6+QBmyVM="
    crossorigin="anonymous">
    </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CrocoTraff</title>
  <link rel="stylesheet" href="/admin/admin__section/admin.css">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="login.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Jolly+Lodger&family=Karantina:wght@300;400;700&display=swap"
    rel="stylesheet">
  <link rel="shortcut icon" href="/img/logo.png" type="image/x-icon">
</head>

<body>





  <div id="preloader">
    <div class="spinner"></div>
  </div>
  <header class="header">
    <div class="header-wrapper">
      <a href="/index.html" class="header__left">
        <img src="/img/logo.png" alt="Croco" class="header__logo">
        <span class="logo__text">Croco <div>Traff</div></span>
      </a>
      <div class="header__right">
        <a href="/login__section/login.html" class="login-btn">Вхід</a>
        <a href="/admin/reg__section/registration.html" class="register-btn">Реєстрація</a>
        <div onclick="burger();" class="burger-area">
          <button class="burger"></button>
        </div>
      </div>
    </div>
  </header>

  <div class="burger__section">
    <div class="container">
      <div class="burger__wrapper">
        <ul class="burger__list">
          <li><a class="burger__link" href="/admin/admin__section/admin.html">
              <p class="link__text">Кабінет</p>
            </a></li>
          <li><a class="burger__link" href="#">
              <p class="link__text">ПРО НАС</p>
            </a></li>
          <li><a class="burger__link" href="#">
              <p class="link__text">ВIДГУКИ</p>
            </a></li>
          <li><a class="burger__link" href="#">
              <p class="link__text">ПIДРИМКА</p>
            </a></li>
          <li><a class="burger__link" href="#">
              <p class="link__text">Реферальна програма</p>
            </a></li>
        </ul>
        <div class="burger__footer">
          <div class="burger__left">
            <p class="info__item">crocotraffTelegram</p>
            <p class="info__item">crocotraffinfo@gmail.com</p>
          </div>
          <div class="burger__right">
            <button class="btn-tg">
              <img src="/img/burger/plane.png" alt="">
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>



  <main>
    <section class="log__section">
      <div class="log__wrapper">
        <div class="log__left">
          <h1 class="log__title">ВХІД</h1>
          <div class="log__buttons">
            <h3 class="h3-log">Username / e-mail</h3>
            <input class="email-input" value="" type="email, text">
            <h3 class="h3-log">Password</h3>
            <input class="email-input" value="" type="password">
          </div>
          <div class="reg__choice">
            <label style="margin-right: 20px;" class="radio-container">
              <input type="radio" name="example" value="1">
              <span class="custom-radio"></span>
              <h3 class="h3-log">ЗАПОМНИТЬ МЕНЯ</h3>
            </label>
          </div>
          <button
            style="display: flex; align-items: center; justify-content: center; width: 100%; margin: 35px 0 30px; padding: 30px 120px;"
            href="#" class="green-btn">ВХІД</button>
          <a class="already__log" href="">Забули пароль?</a>
          <a class="already__log" href="/admin/reg__section/registration.html">Реєстрація</a>
        </div>
        <div class="reg__right">
          <article class="croco__right">
            <div class="croco__group">
              <img class="croco__coin-img" src="/img/Intro/Croco.png" alt="Croco">
            </div>
            <div class="reg__info-right">
              <h2 class="croco-log__title">Croco<br><span>Traff</span>
              </h2>
            </div>
          </article>
        </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-wrapper">
        <div class="footer__left">
          <img src="/img/logo.png" alt="Croco" class="footer__logo">
          <span class="logo__text">Croco <div>Traff</div></span>
        </div>
        <div class="footer__right">
          <p class="info__item">crocotraffTelegram</p>
          <p class="info__item">crocotraffinfo@gmail.com</p>
        </div>
      </div>
    </div>
    </div>
  </footer>
  <script src="/app.js"></script>

</body>

</html>
